<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>记忆识海</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #05070d; overflow: hidden;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  #sea { display: block; width: 100%; height: 100%; }
  #sea3d { display: block; width: 100%; height: 100%; position: absolute; inset: 0; }
  #sea3d[hidden] { display: none; }
  .hud { position: absolute; pointer-events: none; color: #cfe0f5; }
  .title { top: 20px; left: 24px; }
  .title h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.14em; color: #e6f1ff; }
  .title p { margin: 6px 0 0; font-size: 11.5px; color: #6f86a6; letter-spacing: 0.04em; }
  .switch { top: 20px; left: 50%; transform: translateX(-50%); pointer-events: auto;
    display: flex; gap: 0; border: 1px solid rgba(120,160,210,0.22); border-radius: 7px; overflow: hidden; }
  .switch button { background: rgba(14,22,38,0.72); border: 0; color: #7d93b3; font-size: 11px;
    padding: 6px 12px; cursor: pointer; letter-spacing: 0.04em; transition: color .16s, background .16s; }
  .switch button:hover { color: #cfe0f5; }
  .switch button.on { background: rgba(90,140,200,0.28); color: #eaf3ff; }
  .mode { top: 12px; left: 118px; pointer-events: auto; display: flex; gap: 6px; align-items: center; }
  .mode .seg { display: flex; border: 1px solid rgba(120,160,210,0.22); border-radius: 6px; overflow: hidden; }
  .mode .seg button { background: rgba(14,22,38,0.72); border: 0; color: #7d93b3; font-size: 10.5px;
    padding: 4px 9px; cursor: pointer; letter-spacing: 0.04em; transition: color .16s, background .16s; }
  .mode .seg button:hover { color: #cfe0f5; }
  .mode .seg button.on { background: rgba(90,140,200,0.28); color: #eaf3ff; }
  .mode .reset { background: none; border: 1px solid rgba(120,160,210,0.25); color: #a9c2dd;
    border-radius: 5px; font-size: 10.5px; padding: 3px 8px; cursor: pointer; display: none; }
  .mode .reset:hover { border-color: rgba(160,200,245,0.5); color: #e2f0ff; }
  body.mode-3d .mode .reset { display: inline-block; }
  .mode .gear { background: none; border: 1px solid rgba(120,160,210,0.25); color: #a9c2dd;
    border-radius: 5px; font-size: 10.5px; padding: 3px 7px; cursor: pointer; display: none;
    line-height: 1.2; }
  .mode .gear:hover, .mode .gear.on { border-color: rgba(160,200,245,0.5); color: #e2f0ff; }
  body.mode-3d .mode .gear { display: inline-block; }
  /* 3D 参数浮层:挂在模式按钮下方,只在 3D 模式出现(2D 没有厚度/透视可言)。 */
  .opts { top: 44px; left: 118px; pointer-events: auto; display: none; flex-direction: column;
    gap: 7px; padding: 10px 12px; border-radius: 8px; background: rgba(11,18,31,0.94);
    border: 1px solid rgba(120,160,210,0.24); box-shadow: 0 12px 34px rgba(0,0,0,0.6); }
  .opts.on { display: flex; }
  .opts .row { display: flex; align-items: center; gap: 9px; font-size: 10.5px; }
  .opts .row > b { font-weight: 400; width: 52px; color: #93aac7; letter-spacing: 0.04em; }
  .opts .seg { display: flex; border: 1px solid rgba(120,160,210,0.22); border-radius: 5px; overflow: hidden; }
  .opts .seg button { background: rgba(14,22,38,0.72); border: 0; color: #7d93b3; font-size: 10px;
    padding: 3px 8px; cursor: pointer; letter-spacing: 0.03em; transition: color .16s, background .16s; }
  .opts .seg button:hover { color: #cfe0f5; }
  .opts .seg button.on { background: rgba(90,140,200,0.28); color: #eaf3ff; }
  .search { top: 18px; right: 24px; pointer-events: auto; }
  .search input { width: 190px; padding: 7px 11px; font-size: 12px; color: #dceaff;
    background: rgba(14,22,38,0.72); border: 1px solid rgba(120,160,210,0.22);
    border-radius: 7px; outline: none; transition: border-color .18s, width .18s; }
  .search input:focus { border-color: rgba(150,195,245,0.5); width: 230px; }
  .legend { bottom: 18px; left: 24px; display: flex; gap: 14px; font-size: 11px; color: #7d93b3; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .timeline { bottom: 16px; right: 24px; width: min(320px, 42vw); pointer-events: auto; }
  .timeline .row { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #7d93b3; }
  .timeline input[type=range] { flex: 1; accent-color: #7fa8d8; height: 3px; }
  .timeline button { background: none; border: 1px solid rgba(120,160,210,0.25); color: #a9c2dd;
    border-radius: 5px; font-size: 10.5px; padding: 2px 7px; cursor: pointer; }
  .timeline button:hover { border-color: rgba(160,200,245,0.5); color: #e2f0ff; }
  .card { position: absolute; max-width: 300px; padding: 11px 13px; border-radius: 9px;
    background: rgba(11,18,31,0.94); border: 1px solid rgba(120,160,210,0.24);
    box-shadow: 0 12px 34px rgba(0,0,0,0.6); font-size: 12.5px; line-height: 1.55;
    color: #d5e5f7; pointer-events: none; opacity: 0; transform: translateY(4px);
    transition: opacity .14s, transform .14s; }
  .card.on { opacity: 1; transform: translateY(0); }
  .card .meta { margin-top: 7px; font-size: 10.5px; color: #6d84a4; display: flex; gap: 8px; flex-wrap: wrap; }
  .card .type { color: #9fc0e4; }
  /* [hidden] 的 UA 规则 (display:none) 优先级低于 .empty 的 display:grid,
     不加这一条空态遮罩永远盖在画面上。 */
  .empty[hidden] { display: none; }
  .empty { position: absolute; inset: 0; display: grid; place-content: center; text-align: center;
    color: #5d7291; font-size: 13px; line-height: 2; pointer-events: none; }
  .empty b { display: block; color: #8fa9c9; font-weight: 500; margin-bottom: 4px; }
  /* 窄侧边栏(≤560px):标题、模式、数据源、搜索四块在一条线上必然打架。
     改成两行——第一行标题 + 模式,第二行数据源居中 + 搜索靠右。 */
  @media (max-width: 560px) {
    .title { top: 12px; left: 14px; }
    .title h1 { font-size: 13.5px; }
    .title p { font-size: 10.5px; margin-top: 4px; }
    .mode { top: 10px; left: auto; right: 14px; }
    /* 参数浮层要让开第二行(数据源 + 搜索),否则会盖住搜索框。 */
    .opts { top: 90px; left: auto; right: 14px; }
    .switch { top: 52px; left: 14px; transform: none; }
    .search { top: 46px; right: 14px; }
    .search input { width: 132px; padding: 5px 9px; font-size: 11px; }
    .search input:focus { width: 168px; }
    .legend { bottom: 12px; left: 14px; gap: 9px; font-size: 10px; flex-wrap: wrap; width: calc(100% - 28px); }
    .timeline { bottom: 46px; right: 14px; width: calc(100% - 28px); }
    .card { max-width: calc(100% - 28px); font-size: 12px; }
  }
</style>
</head>
<body>
<canvas id="sea"></canvas>
<canvas id="sea3d" hidden></canvas>
<div class="hud title"><h1>记忆识海</h1><p id="sub">正在读取…</p></div>
<div class="hud mode" id="mode">
  <div class="seg">
    <button type="button" data-view="2d" class="on">2D</button>
    <button type="button" data-view="3d">3D</button>
  </div>
  <button type="button" class="reset" id="resetView">回正</button>
  <button type="button" class="gear" id="optToggle" title="3D 参数" aria-label="3D 参数">⚙</button>
</div>
<div class="hud opts" id="opts">
  <div class="row"><b>大脑厚度</b><div class="seg" data-opt="depth">
    <button type="button" data-val="0.42">0.42</button>
    <button type="button" data-val="0.6">0.60</button>
    <button type="button" data-val="0.85">0.85</button>
  </div></div>
  <div class="row"><b>闲置自转</b><div class="seg" data-opt="rotate">
    <button type="button" data-val="off">关</button>
    <button type="button" data-val="on">开</button>
  </div></div>
  <div class="row"><b>透视强度</b><div class="seg" data-opt="persp">
    <button type="button" data-val="soft">温和</button>
    <button type="button" data-val="strong">强烈</button>
  </div></div>
</div>
<div class="hud switch" id="switch">
  <button type="button" data-source="consolidated">巩固记忆</button>
  <button type="button" data-source="raw">原始记忆</button>
</div>
<div class="hud search"><input id="q" type="search" placeholder="搜索记忆…" autocomplete="off" /></div>
<div class="hud legend" id="legend"></div>
<div class="hud timeline">
  <div class="row">
    <button id="play" type="button">▶ 回放</button>
    <input id="time" type="range" min="0" max="1000" value="1000" />
    <span id="timeLabel">全部</span>
  </div>
</div>
<div class="card" id="card"></div>
<div class="empty" id="empty" hidden><b id="emptyTitle">还没有巩固记忆</b><span id="emptyBody">聊天内容会先成为碎片,<br />夜间巩固后才会在这里点亮。</span></div>
<script type="module" src="./sea-app.js"></script>
</body>
</html>
