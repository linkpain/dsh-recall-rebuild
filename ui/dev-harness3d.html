<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8" /><title>sea harness 3d</title>
<style>
html,body{margin:0;height:100%;background:#05070d;overflow:hidden;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
#sea{display:block;width:100%;height:100%}
.card{position:absolute;max-width:300px;padding:11px 13px;border-radius:9px;background:rgba(11,18,31,.94);
border:1px solid rgba(120,160,210,.24);color:#d5e5f7;font:12.5px/1.55 -apple-system,"Segoe UI",sans-serif;opacity:0;pointer-events:none}
.card.on{opacity:1}
#hud{position:absolute;left:20px;top:16px;color:#9fb6d2;font-size:12px;line-height:1.7;pointer-events:none}
#hud b{color:#dceaff}
</style></head>
<body><canvas id="sea"></canvas><div class="card" id="card"></div><div id="hud"></div>
<script type="module">
import { SeaView } from './sea-view.js';
import { SeaView3D } from './sea-view3d.js';

const Q = new URLSearchParams(location.search);
const COUNT = Number(Q.get('n') ?? 325);
const MODE = Q.get('view') ?? '3d';
const MORPH = Q.get('morph');
const YAW = Q.get('yaw');
const PITCH = Q.get('pitch');
const DEPTH = Q.get('depth');
const DIST = Q.get('dist');
const AUTO = Q.get('auto');

const TYPES = ['lingshu','mnemon','lingshu','lingshu','mnemon','dsh-memory'];
const nodes = Array.from({ length: COUNT }, (_, i) => ({
  id: 'm' + i,
  type: TYPES[i % TYPES.length],
  content: '记忆条目 #' + i + ' 的内容预览,用来测试悬停卡片与搜索',
  confidence: 0.5 + (i % 50) / 100,
  status: 'active',
  createdAt: 1760000000000 + i * 3600000,
}));
// 造一个稀疏图:每个点连前后各一个,再随机跨接,近似真实联想密度
const links = [];
for (let i = 1; i < nodes.length; i += 1) links.push({ source: nodes[i].id, target: nodes[i - 1].id, weight: 0.4 });
let seed = 7;
const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
for (let k = 0; k < COUNT * 1.4; k += 1) {
  const a = Math.floor(rnd() * COUNT);
  const b = Math.min(COUNT - 1, Math.max(0, a + Math.floor((rnd() - 0.5) * 40)));
  if (a !== b) links.push({ source: nodes[a].id, target: nodes[b].id, weight: 0.15 + rnd() * 0.85 });
}

const canvas = document.getElementById('sea');
const card = document.getElementById('card');
const hud = document.getElementById('hud');
const onHover = (n, x, y) => {
  if (!n) { card.classList.remove('on'); return; }
  card.textContent = n.content;
  card.style.left = (x + 16) + 'px';
  card.style.top = (y + 16) + 'px';
  card.classList.add('on');
};

const view = MODE === '2d'
  ? new SeaView(canvas, { onHover })
  : new SeaView3D(canvas, { onHover });

if (view instanceof SeaView3D) {
  if (YAW != null) view.yaw = Number(YAW);
  if (PITCH != null) view.pitch = Number(PITCH);
  if (DEPTH != null) view.depth = Number(DEPTH);
  if (DIST != null) view.dist = Number(DIST);
  if (AUTO === '1') view.autoRotate = true;
  if (MORPH != null) view.morph = Number(MORPH);
}
view.setData(nodes, links);
// 截图模式:headless 下 rAF 不推进,直接同步画几帧再停
if (Q.get('still') === '1') {
  view.resize();
  for (let i = 0; i < 3; i += 1) view._frame();
} else {
  view.start();
}

const paint = () => {
  const extra = view instanceof SeaView3D
    ? ` · yaw ${(view.yaw * 180 / Math.PI).toFixed(0)}° · pitch ${(view.pitch * 180 / Math.PI).toFixed(0)}° · dist ${view.dist.toFixed(2)} · depth ${view.depth.toFixed(2)} · morph ${view.morph.toFixed(2)} · lod ${view.lodLevel}`
    : ' · 2D 模式';
  hud.innerHTML = `<b>${COUNT} 点 · ${links.length} 边</b>${extra}`;
};
paint();
setInterval(paint, 300);

// 供截图脚本用:暴露到 window,便于在控制台调参
window.__view = view;
</script></body></html>
